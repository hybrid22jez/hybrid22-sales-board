<title>H22 Power Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen office TV board styled as a vintage manga page. Idle = inked paper panels over a live sky with the fighter training; celebrations = full-screen power-ups and boss fights. A printed-paper overlay (fibres, screentone, faded ink) ages everything. Single look by choice. */
:root{
  --void:#06091c; --pp:#fff6df; --pp2:#ffe6a8; --nk:#160f1e; --sepia:#5b4a3a; --vred:#e3260f; --zblue:#0f2f9c; --zgold:#ffd23a; --zorange:#ff7a00;
  --ink:#fff4dc; --dim:#6b5a45; --line:#1b1520;
  --display:"Bangers","Russo One",Impact,sans-serif;
  --body:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--nk);font-family:var(--body);overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(4,8,30,.4) 0%,rgba(4,8,30,.08) 60%,rgba(4,8,30,.2) 100%)}
#crew{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#app{position:relative;z-index:3;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:1.8vh;padding-inline:clamp(16px,3vw,48px);padding-block:clamp(12px,2.5vh,32px);box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand,.clock{background:var(--pp);border:3px solid var(--nk);box-shadow:5px 5px 0 var(--nk);padding:.08em .5em .02em}
.brand{font-family:var(--display);font-size:clamp(20px,2.5vw,40px);letter-spacing:.06em;transform:rotate(-1.2deg)}
.brand span{color:var(--zorange);font-family:var(--display);letter-spacing:.12em;font-size:.6em;margin-left:.6em}
.clock{font-family:var(--display);font-size:clamp(18px,2vw,32px);letter-spacing:.06em;font-variant-numeric:tabular-nums;transform:rotate(1deg)}
main{display:grid;grid-template-columns:minmax(0,760px) 1fr;gap:clamp(16px,3vw,56px);min-height:0;align-items:start;align-content:start}
@media (max-width:760px){main{grid-template-columns:1fr}body{overflow:auto}#app{height:auto;min-height:100%}}
.today{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1vh;min-width:0;max-width:760px;
  background:var(--pp);border:4px solid var(--nk);box-shadow:8px 8px 0 var(--nk);padding:clamp(12px,1.8vh,24px) clamp(14px,1.6vw,26px);transform:rotate(-.4deg)}
.today::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(27,21,32,.22) 1.3px,transparent 1.8px) 0 0/9px 9px;
  -webkit-mask:linear-gradient(135deg,transparent 50%,#000 100%);mask:linear-gradient(135deg,transparent 50%,#000 100%)}
.today>*{position:relative}
.today>.eyebrow{align-self:flex-start;background:var(--zblue);color:var(--zgold);padding:.3em .8em;letter-spacing:.18em;transform:rotate(-1deg);box-shadow:4px 4px 0 var(--nk)}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-weight:700;color:var(--sepia);font-size:clamp(13px,1.3vw,20px)}
.big{font-family:var(--display);font-size:clamp(52px,8.5vw,150px);line-height:.92;letter-spacing:.03em;font-variant-numeric:tabular-nums;align-self:flex-start;
  color:var(--zorange);background:linear-gradient(180deg,#fff6a0 0%,var(--zgold) 38%,var(--zorange) 72%,#e23b0a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:.045em var(--nk);paint-order:stroke fill;filter:drop-shadow(.05em .05em 0 var(--nk)) drop-shadow(.025em .025em 0 var(--vred))}
.subline{font-size:clamp(16px,1.7vw,28px);font-weight:700;color:var(--nk)}
.subline b{font-family:var(--display);font-weight:400;letter-spacing:.04em;color:var(--vred);font-size:1.1em}
.meter{height:clamp(14px,1.8vh,20px);background:var(--pp2);border:3px solid var(--nk);overflow:hidden;max-width:820px}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 5px,transparent 5px 11px),linear-gradient(90deg,#2fb8ff,#8d5cff,#ffb000,#ff2d2d);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.meterlab{display:flex;justify-content:space-between;gap:12px;max-width:820px;color:var(--sepia);font-weight:700;font-size:clamp(13px,1.2vw,18px);font-variant-numeric:tabular-nums}
.meterlab.boss{color:var(--vred)}
.bigrow{display:flex;align-items:flex-end;gap:.6em;flex-wrap:wrap}
.goalof{font-family:var(--display);font-size:clamp(20px,2.1vw,36px);letter-spacing:.04em;color:var(--sepia);padding-bottom:.35em}
.goalof b{font-weight:400;color:var(--nk)}
.meter{position:relative;overflow:visible;margin-top:1.3em}
.meter i{overflow:hidden}
.meter em{position:absolute;top:-9px;bottom:-9px;width:0;border-left:4px solid var(--nk);left:0;transition:left 1s}
.meter em::after{content:"PACE";position:absolute;top:-1.5em;left:-1.6em;font:700 12px var(--body);letter-spacing:.14em;color:var(--nk)}
.pacerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.pace{font-family:var(--display);letter-spacing:.06em;font-size:clamp(16px,1.6vw,26px);padding:.08em .55em;border:3px solid var(--nk);box-shadow:4px 4px 0 var(--nk);transform:rotate(-1.5deg);background:var(--zgold);color:var(--nk)}
.pace.ahead{background:#36d07a}
.pace.behind{background:var(--vred);color:#fff6df}
.pace.done{background:#2fb8ff}
.pacenote{color:var(--sepia);font-weight:700;font-size:clamp(13px,1.2vw,18px);font-variant-numeric:tabular-nums}
.boss{justify-self:end;width:min(360px,100%);display:flex;flex-direction:column;gap:6px;background:#24142a;color:#fff6df;border:3px solid var(--nk);box-shadow:6px 6px 0 var(--nk);padding:10px 14px 12px}
.bosshead{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);letter-spacing:.08em;font-size:clamp(15px,1.3vw,22px)}
.bosshead b{font-weight:400;color:var(--zgold)}
.bosshead span:last-child{color:#ff9aa4}
.hp{height:clamp(12px,1.6vh,18px);background:#3a1420;border:2.5px solid var(--nk);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 12px),linear-gradient(180deg,#ff8a3d,#ff2d3d 60%,#b3162b);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.hp.low i{background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 2px,transparent 2px 12px),linear-gradient(180deg,#ffe08a,#ffb000 60%,#d26a00)}
.hplab{display:flex;justify-content:space-between;font-family:var(--display);letter-spacing:.08em;font-size:clamp(14px,1.2vw,20px);font-variant-numeric:tabular-nums}
.bossfoot{font-weight:700;font-size:clamp(12px,1vw,16px);color:#ffd6da;font-variant-numeric:tabular-nums}
.feed{min-width:0;display:flex;flex-direction:column;gap:1.4vh;min-height:0}
.feed .eyebrow{align-self:flex-start;background:var(--zblue);color:var(--zgold);box-shadow:4px 4px 0 var(--nk);padding:.25em .7em;transform:rotate(-1.5deg);letter-spacing:.18em}
.feed ol{list-style:none;margin:0;padding:0 10px 10px 0;display:flex;flex-direction:column;gap:1.3vh;overflow:hidden}
.feed li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:.8vh 16px;background:var(--pp);color:var(--nk);border:3px solid var(--nk);border-left:12px solid var(--c);box-shadow:6px 6px 0 var(--nk)}
.feed li:nth-child(odd){transform:rotate(.5deg)} .feed li:nth-child(even){transform:rotate(-.5deg)}
.feed .who{min-width:0}
.feed .name{font-family:var(--display);letter-spacing:.04em;font-size:clamp(20px,2.2vw,36px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .prod{color:var(--sepia);font-weight:700;font-size:clamp(13px,1.2vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .val{font-family:var(--display);letter-spacing:.03em;font-size:clamp(22px,2.3vw,38px);font-variant-numeric:tabular-nums;color:var(--nk);text-shadow:.07em .07em 0 var(--c)}
.feed .time{color:var(--sepia);font-weight:700;font-size:clamp(12px,1.1vw,17px);font-variant-numeric:tabular-nums;text-align:right}
.tag{font-family:var(--body);font-size:.45em;letter-spacing:.14em;text-transform:uppercase;color:var(--nk);border:1.5px solid var(--nk);padding:0 5px;margin-left:8px;vertical-align:middle}
footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tiers{display:flex;gap:10px;flex-wrap:wrap}
.tier{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--pp);color:var(--nk);border:2.5px solid var(--nk);box-shadow:3px 3px 0 var(--nk);font-family:var(--display);letter-spacing:.08em;font-size:clamp(14px,1.25vw,20px)}
.tier::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--nk)}
.tier small{font-family:var(--body);color:var(--sepia);letter-spacing:.04em;font-weight:700;font-size:.7em;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls button,.controls .filebtn{font:700 14px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--nk);background:var(--pp);border:2.5px solid var(--nk);border-left:6px solid var(--c,var(--sepia));box-shadow:3px 3px 0 var(--nk);padding:7px 11px;cursor:pointer}
.controls .filebtn{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls button:hover,.controls .filebtn:hover{background:var(--pp2)}
.controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--nk)}
.controls button:focus-visible{outline:3px solid var(--vred);outline-offset:2px}
.controls input:focus-visible + .filebtn,.controls .filebtn:focus-within{outline:3px solid var(--vred);outline-offset:2px}
.controls button[aria-pressed="true"]{background:var(--pp2)}
body.tv .controls{display:none}
#stage{position:fixed;inset:0;z-index:10;background:#000}
#fx{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw;text-align:center}
.hud .top{font-family:var(--display);letter-spacing:.1em;font-size:clamp(24px,3.8vw,64px);color:var(--ink);-webkit-text-stroke:.06em var(--nk);paint-order:stroke fill;text-shadow:.06em .06em 0 var(--nk);opacity:0;transition:opacity .3s}
.hud .top small{display:block;font-family:var(--body);font-weight:700;letter-spacing:.3em;font-size:.34em;-webkit-text-stroke:0;color:var(--ink);text-shadow:0 2px 0 #000}
.hud .bottom{display:flex;flex-direction:column;align-items:center;gap:.4vh}
.hud .value{font-family:var(--display);font-size:clamp(64px,11.5vw,210px);line-height:.95;letter-spacing:.03em;font-variant-numeric:tabular-nums;
  color:var(--zorange);background:linear-gradient(180deg,#fff6a0 0%,var(--zgold) 38%,var(--zorange) 72%,#e23b0a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:.05em var(--nk);paint-order:stroke fill;filter:drop-shadow(.05em .05em 0 var(--nk)) drop-shadow(0 0 .25em var(--c))}
.hud .who{font-family:var(--display);letter-spacing:.05em;font-size:clamp(26px,3.6vw,60px);color:var(--ink);-webkit-text-stroke:.07em var(--nk);paint-order:stroke fill;text-shadow:.06em .06em 0 var(--nk);opacity:0;transform:translateY(20px);transition:all .5s cubic-bezier(.2,.8,.2,1)}
.hud .meta{font-size:clamp(15px,1.8vw,28px);font-weight:700;color:var(--ink);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 0 #000,0 0 8px #000;opacity:0;transition:opacity .6s .2s}
.hud.revealed .who{opacity:1;transform:none}
.hud.revealed .meta{opacity:1}
.intro{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(44px,9vw,160px);letter-spacing:.06em;color:var(--ink);-webkit-text-stroke:.05em var(--nk);paint-order:stroke fill;text-shadow:.06em .06em 0 var(--nk),.1em .1em 0 var(--vred);pointer-events:none;opacity:0}
.intro.go{animation:slam 1s ease-out forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-6deg)}18%{opacity:1;transform:scale(1) rotate(-3deg)}70%{opacity:1}100%{opacity:0;transform:scale(.92) rotate(-3deg)}}
/* vintage print overlay: faded ink, aged paper, screentone */
#vSat,#vPaper,#vTone{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#vSat{display:none}
#vPaper{mix-blend-mode:multiply}
#vTone{display:none}
@media (prefers-reduced-motion:reduce){.intro.go{animation:none;opacity:0}.meter i{transition:none}}
</style>

<script>
/* ===== CONFIG (edit these) ===== */
const CONFIG = {
  weeklyTarget: 9000, 
  bossEvery: 15000,              // a boss fight plays for every $15,000 of contract value sold in a calendar month          // contract value goal shown on the meter
  feedUrl: "",                   // live sale feed JSON (set once hosted on Netlify). Empty = demo mode
  pollMs: 20000,
  tiers: [ // min contract value in $ for each tier
    { key:"spark",     name:"Spark",     min:0,    color:"#5ad1ff", charge:2200, shake:1,  particles:40,  bolts:0, rocks:4  },
    { key:"charge",    name:"Charge",    min:500,  color:"#a98bff", charge:3000, shake:3,  particles:70,  bolts:0, rocks:8  },
    { key:"surge",     name:"Surge",     min:1500, color:"#ffb020", charge:4000, shake:6,  particles:110, bolts:2, rocks:14 },
    { key:"overdrive", name:"Overdrive", min:3000, color:"#ff3b5c", charge:5200, shake:11, particles:170, bolts:5, rocks:22 }
  ]
};
/* Approx Melbourne sunrise/sunset (local clock, mid-month averages, DST included). Good enough for sky colour. */
const SUN_TIMES = [[6.25,20.75],[6.83,20.33],[7.33,19.75],[6.92,18.0],[7.33,17.42],[7.58,17.17],[7.5,17.33],[7.08,17.75],[6.5,18.17],[6.67,19.75],[6.08,20.25],[5.92,20.67]];

const contractValue = (weekly, weeks) => Math.round(weekly * weeks);

/* Example data so the board opens in a working state (replaced by the live feed) */
const now = new Date();
const ago = m => new Date(now.getTime() - m*60000).toISOString();
let sales = [
  { id:"ex1", firstName:"Ella",   product:"12 Month Membership · $60/wk", contractValue:contractValue(60,52), soldBy:"Zane", soldAt:ago(42),  example:true },
  { id:"ex3", firstName:"Priya",  product:"12 Month Membership · $50/wk", contractValue:contractValue(50,52), soldBy:"Zane", soldAt:ago(180), example:true },
  { id:"ex4", firstName:"Jordan", product:"10 Class Pack",                contractValue:280,                 soldBy:"Kat",  soldAt:ago(300), example:true }
];
const seen = new Set(sales.map(s=>s.id));

const $ = id => document.getElementById(id);
const money = n => "$" + Math.round(n).toLocaleString("en-AU");
const tierFor = v => [...CONFIG.tiers].reverse().find(t => v >= t.min);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const melDay = d => new Date(d).toLocaleDateString("en-CA",{timeZone:"Australia/Melbourne"});

/* ===== Colour helpers ===== */
const toRgb = h => { const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
const toHex = a => "#" + a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mix = (a,b,k) => { const A=toRgb(a),B=toRgb(b); return toHex(A.map((v,i)=>v+(B[i]-v)*k)); };
const darken = (h,k) => mix(h,"#000000",k), lighten = (h,k) => mix(h,"#ffffff",k);
const hexA = (h,a) => { const [r,g,b]=toRgb(h); return `rgba(${r},${g},${b},${Math.max(0,Math.min(1,a))})`; };
function rng(seed){ let s=seed>>>0||1; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }

/* ===== Sky: palettes by time of day ===== */
const PAL = {
  night:{ top:"#03072a", mid:"#0f1f6e", hor:"#3a3fa8", cloudL:"#5d68c9", cloudS:"#2a2f7d", cloudLine:"#0b0d22", sun:"#fff6c8", far:"#2a2458", near:"#1b1638", stars:1 },
  dawn: { top:"#2a2f9a", mid:"#ef5a8a", hor:"#ffc15a", cloudL:"#ffe2b8", cloudS:"#e0708f", cloudLine:"#5f3358", sun:"#fff4b0", far:"#b0566a", near:"#6e3346", stars:0 },
  day:  { top:"#0a47d4", mid:"#2a8cf2", hor:"#a8e8ff", cloudL:"#ffffff", cloudS:"#a7c3f2", cloudLine:"#5d7fae", sun:"#fffbe0", far:"#e3914a", near:"#c9793b", stars:0 },
  dusk: { top:"#1d1a72", mid:"#e2366a", hor:"#ff9a2e", cloudL:"#ffc08a", cloudS:"#c4466e", cloudLine:"#46203f", sun:"#ffd46a", far:"#a24158", near:"#5a2338", stars:0 }
};
function mixPal(a,b,k){ const o={}; for(const key in a) o[key] = typeof a[key]==="number" ? a[key]+(b[key]-a[key])*k : mix(a[key],b[key],k); return o; }
function melNow(){
  const p=new Intl.DateTimeFormat("en-AU",{timeZone:"Australia/Melbourne",month:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date());
  const g=k=>+p.find(x=>x.type===k).value; return { month:g("month"), mins:g("hour")*60+g("minute") };
}
const SKY_MODES=["auto","dawn","day","dusk","night"]; let skyMode="auto", skyCache=null;
function computeSky(){
  if(skyMode!=="auto"){ const pre={dawn:["dawn",0.03],day:["day",0.42],dusk:["dusk",0.97],night:["night",null]}[skyMode]; return {pal:PAL[pre[0]], u:pre[1], id:++skyId}; }
  const {month,mins}=melNow(); const sr=SUN_TIMES[month-1][0]*60, ss=SUN_TIMES[month-1][1]*60;
  const keys=[[sr-70,"night"],[sr-5,"dawn"],[sr+80,"day"],[ss-90,"day"],[ss,"dusk"],[ss+55,"night"]];
  let pal=PAL.night;
  if(mins>keys[0][0] && mins<keys[5][0]) for(let i=0;i<5;i++){ if(mins<=keys[i+1][0]){ pal=mixPal(PAL[keys[i][1]],PAL[keys[i+1][1]],(mins-keys[i][0])/(keys[i+1][0]-keys[i][0])); break; } }
  const u=(mins>=sr-25 && mins<=ss+25) ? (mins-sr)/(ss-sr) : null;
  return {pal,u,id:++skyId};
}
let skyId=0;

/* Cloud shapes (deterministic) */
const CLOUDS = Array.from({length:7},(_,i)=>{
  const r=rng(i*31+11), n=4+Math.floor(r()*3), c=[]; let x=0;
  for(let k=0;k<n;k++){ const mid=1-Math.abs(k-(n-1)/2)/n; const rad=24+r()*18+mid*26; c.push([x,-rad*(0.45+r()*0.25),rad]); x+=rad*1.0; }
  c.forEach(q=>q[0]-=x/2);
  return { x:r(), y:0.08+r()*0.32, s:0.7+r()*0.8, v:5+r()*9, c };
});

function drawCloud(c,x,y,s,cl,P){
  // painted cel-background cloud: soft body, bright lit crown, shadowed belly, no ink line
  c.save(); c.translate(x,y); c.scale(s,s);
  const path=new Path2D(); cl.c.forEach(([dx,dy,r])=>{ path.moveTo(dx+r,dy); path.arc(dx,dy,r,0,Math.PI*2); });
  c.save(); c.beginPath(); c.rect(-2000,-2000,4000,2008); c.clip();
  const top=Math.min(...cl.c.map(([dx,dy,r])=>dy-r));
  const g=c.createLinearGradient(0,top,0,8); g.addColorStop(0,P.cloudL); g.addColorStop(0.55,mix(P.cloudL,P.cloudS,0.35)); g.addColorStop(1,P.cloudS);
  c.fillStyle=g; c.fill(path);
  c.save(); c.clip(path); c.translate(-6,-9); c.globalAlpha=0.7; c.fillStyle=lighten(P.cloudL,0.5); c.fill(path); c.restore();
  c.save(); c.clip(path); c.globalAlpha=0.35; c.fillStyle=darken(P.cloudS,0.15); c.fillRect(-2000,-14,4000,30); c.restore();
  c.restore(); c.restore();
}

function drawScene(c,W,H,t,horizon,st){
  const P=st.pal, u0=Math.min(W,H);
  const g=c.createLinearGradient(0,0,0,horizon); g.addColorStop(0,P.top); g.addColorStop(0.58,P.mid); g.addColorStop(1,P.hor);
  c.fillStyle=g; c.fillRect(0,0,W,horizon+2);
  // stars
  if(P.stars>0.02){ const r=rng(7); for(let i=0;i<110;i++){ const x=r()*W, y=r()*horizon*0.85, z=r()*1.8+0.6;
    c.fillStyle=`rgba(255,255,240,${P.stars*(0.45+0.55*Math.sin(t/650+i*1.7)**2)})`; c.fillRect(x,y,z,z); } }
  // sun or moon
  const R=u0*0.055;
  if(st.u!==null){ const u=Math.max(-0.05,Math.min(1.05,st.u)); const sx=W*(0.08+0.84*u), sy=horizon-Math.sin(Math.PI*Math.max(0,Math.min(1,u)))*horizon*0.72+R*0.4;
    for(let k=3;k>=1;k--){ c.fillStyle=hexA(P.sun,0.1); c.beginPath(); c.arc(sx,sy,R*(1+k*0.55),0,Math.PI*2); c.fill(); }
    c.fillStyle=P.sun; c.beginPath(); c.arc(sx,sy,R,0,Math.PI*2); c.fill(); }
  else if(P.stars>0.5){ const mx=W*0.8, my=horizon*0.2;
    c.fillStyle=hexA("#f3eed2",0.12); c.beginPath(); c.arc(mx,my,R*1.7,0,Math.PI*2); c.fill();
    c.fillStyle="#f3eed2"; c.beginPath(); c.arc(mx,my,R*0.85,0,Math.PI*2); c.fill();
    c.fillStyle=P.top; c.beginPath(); c.arc(mx+R*0.38,my-R*0.2,R*0.75,0,Math.PI*2); c.fill(); }
  // clouds
  const cs=u0/900, span=W+600*cs;
  CLOUDS.forEach(cl=>{ const x=((cl.x*span + t/1000*cl.v*cs*3) % span) - 300*cs; drawCloud(c,x,cl.y*horizon+60*cs,cl.s*cs,cl,P); });
  // mountains + ground (cached per size and sky colour)
  c.drawImage(staticLayer(W,H,horizon,st),0,0,W,H);
}

const staticCache=new Map();
function staticLayer(W,H,horizon,st){
  const key=[W,H,Math.round(horizon),st.id].join(",");
  let off=staticCache.get(key); if(off) return off;
  if(staticCache.size>4) staticCache.clear();
  const d=Math.min(2,devicePixelRatio||1); off=document.createElement("canvas"); off.width=W*d; off.height=H*d;
  const c=off.getContext("2d"); c.setTransform(d,0,0,d,0,0); c.lineJoin="round"; c.lineCap="round";
  drawLand(c,W,H,horizon,st.pal); staticCache.set(key,off); return off;
}

function drawLand(c,W,H,horizon,P){
  const ms=Math.max(0.55,W/1500);
  // 1. distant jagged range, hazed toward the horizon colour
  const rc=mix(P.far,P.hor,0.55), r1=rng(17), pts=[[-20,horizon]]; let x=-20;
  while(x<W+20){ const step=(60+r1()*130)*ms, ph=(70+r1()*150)*ms; x+=step*(0.4+r1()*0.2); pts.push([x,horizon-ph]); x+=step*0.5; pts.push([x,horizon-(15+r1()*45)*ms]); }
  pts.push([W+20,horizon]);
  const rp=poly(pts); c.fillStyle=rc; c.fill(rp);
  c.fillStyle=darken(rc,0.17);
  for(let i=1;i<pts.length-2;i+=2){ const p=pts[i], v=pts[i+1]; c.beginPath(); c.moveTo(p[0],p[1]); c.lineTo(v[0],v[1]);
    c.lineTo(v[0]-(v[0]-p[0])*0.1,horizon); c.lineTo(p[0]+(v[0]-p[0])*0.12,horizon); c.closePath(); c.fill();
    c.strokeStyle=hexA(lighten(rc,0.3),0.7); c.lineWidth=1.6; c.beginPath(); c.moveTo(p[0],p[1]); c.lineTo(p[0]-(p[0]-pts[i-1][0])*0.45,p[1]+(pts[i-1][1]-p[1])*0.45); c.stroke(); }
  c.lineWidth=2; c.strokeStyle=hexA(darken(rc,0.5),0.7); c.stroke(rp);
  const haze=c.createLinearGradient(0,horizon-90*ms,0,horizon); haze.addColorStop(0,hexA(P.hor,0)); haze.addColorStop(1,hexA(P.hor,0.55));
  c.fillStyle=haze; c.fillRect(0,horizon-90*ms,W,90*ms);

  // 2. mid rock pillars and buttes with strata, shaded faces and lit tops
  const r=rng(42); x=-40;
  while(x<W+40){
    x+=(15+r()*140)*ms;
    const w=(45+r()*120)*ms, tall=r()<0.38, h=(tall?150+r()*170:45+r()*80)*ms, top=horizon-h, lean=(r()-.5)*14*ms, bump=r()*9*ms;
    const outline=[[x,horizon+2],[x+w*0.08+lean*0.5,top+h*0.55],[x+w*0.05+lean,top+h*0.4],[x+w*0.13+lean,top+7*ms],[x+w*0.3+lean,top],[x+w*0.55+lean,top-bump],[x+w*0.8+lean,top+3*ms],[x+w*0.9+lean,top+h*0.32],[x+w*0.95+lean*0.5,top+h*0.5],[x+w,horizon+2]];
    const pp=poly(outline);
    c.lineWidth=2.6; c.strokeStyle=darken(P.far,0.55); c.stroke(pp);
    { const rg=c.createLinearGradient(x,0,x+w,0); rg.addColorStop(0,lighten(P.far,0.18)); rg.addColorStop(0.55,P.far); rg.addColorStop(1,darken(P.far,0.12)); c.fillStyle=rg; c.fill(pp); }
    c.save(); c.clip(pp);
    c.fillStyle=darken(P.far,0.32); c.beginPath(); let sx=x+w*0.6+lean; c.moveTo(sx,top-30);
    for(let yy=top;yy<horizon+6;yy+=9*ms) c.lineTo(sx+(r()-.5)*10*ms,yy);
    c.lineTo(x+w+40,horizon+6); c.lineTo(x+w+40,top-30); c.closePath(); c.fill();
    c.fillStyle=hexA(darken(P.far,0.5),0.35); c.fillRect(x-10,horizon-h*0.18,w+20,h*0.2);
    c.strokeStyle=hexA(darken(P.far,0.65),0.5); c.lineWidth=1.6;
    for(let yy=top+12*ms; yy<horizon-4; yy+=(9+r()*13)*ms){ const a=x+r()*w*0.35, b=a+w*(0.25+r()*0.55); c.beginPath(); c.moveTo(a,yy); c.lineTo(b,yy+(r()-.5)*3); c.stroke(); }
    c.strokeStyle=hexA(darken(P.far,0.65),0.55); c.lineWidth=1.4;
    for(let k=0;k<2;k++){ let cx2=x+w*(0.25+r()*0.3), cy2=top+h*(0.15+r()*0.3); c.beginPath(); c.moveTo(cx2,cy2); for(let s=0;s<4;s++){ cx2+=(r()-.5)*10*ms; cy2+=(6+r()*10)*ms; c.lineTo(cx2,cy2);} c.stroke(); }
    c.strokeStyle=hexA(lighten(P.far,0.4),0.85); c.lineWidth=2.4; c.beginPath();
    c.moveTo(x+w*0.05+lean,top+h*0.4); c.lineTo(x+w*0.13+lean,top+7*ms); c.lineTo(x+w*0.3+lean,top); c.lineTo(x+w*0.55+lean,top-bump); c.stroke();
    c.restore();
    x+=w;
  }

  // 3. near ground
  const gg=c.createLinearGradient(0,horizon,0,H); gg.addColorStop(0,lighten(P.near,0.12)); gg.addColorStop(1,darken(P.near,0.35));
  c.fillStyle=gg; c.fillRect(0,horizon+2,W,H-horizon);
  c.strokeStyle=darken(P.near,0.6); c.lineWidth=3; c.beginPath(); c.moveTo(0,horizon+2); c.lineTo(W,horizon+2); c.stroke();
  const r2=rng(5); c.lineWidth=2; c.strokeStyle=hexA(darken(P.near,0.6),0.55);
  for(let i=0;i<16;i++){ const yy=horizon+8+(r2()**1.6)*(H-horizon), xx=r2()*W, ww=(30+r2()*120)*ms*(1+(yy-horizon)/H*2);
    c.beginPath(); c.moveTo(xx,yy); c.lineTo(xx+ww,yy); c.stroke(); }
  const r3=rng(23);
  for(let i=0;i<10;i++){ const yy=horizon+12+(r3()**1.3)*(H-horizon)*0.9, xx=r3()*W, s=(4+r3()*9)*ms*(1+(yy-horizon)/H*2);
    pebble(c,xx,yy,s,s*0.6,P,i+50); }

  // 4. foreground boulders framing the edges
  const gh=H-horizon, bh=Math.min(H*0.3, gh*0.85+H*0.06), bw=Math.max(90,W*0.13);
  boulder(c,W*0.03,H+6,bw,bh,P,3); boulder(c,W*0.15,H+6,bw*0.55,bh*0.55,P,4);
  boulder(c,W*0.97,H+6,bw*1.1,bh*1.05,P,5); boulder(c,W*0.85,H+6,bw*0.5,bh*0.45,P,6);
}
function pebble(c,cx,by,w,h,P,seed){ boulder(c,cx,by,w,h,P,seed,2); }
function boulder(c,cx,by,w,h,P,seed,lw=4){
  const r=rng(seed), n=10, pts=[];
  for(let i=0;i<=n;i++){ const a=Math.PI+i/n*Math.PI; pts.push([cx+Math.cos(a)*w*(0.82+r()*0.28), by+Math.sin(a)*h*(0.78+r()*0.32)]); }
  const bp=poly(pts), base=darken(P.near,0.1);
  c.lineWidth=lw; c.strokeStyle=darken(P.near,0.68); c.stroke(bp);
  c.fillStyle=darken(base,0.38); c.fill(bp);
  c.save(); c.clip(bp); c.translate(-w*0.2,-h*0.14); c.fillStyle=base; c.fill(bp); c.restore();
  if(lw>2){
    c.save(); c.clip(bp); c.strokeStyle=darken(P.near,0.68); c.lineWidth=2;
    for(let k=0;k<3;k++){ let x=cx+(r()-.5)*w, y=by-h*(0.3+r()*0.5); c.beginPath(); c.moveTo(x,y); for(let s=0;s<4;s++){ x+=(r()-.5)*w*0.25; y+=h*0.12; c.lineTo(x,y);} c.stroke(); }
    c.restore();
    c.strokeStyle=hexA(lighten(base,0.35),0.8); c.lineWidth=2.4; c.beginPath();
    for(let i=1;i<6;i++) i===1?c.moveTo(pts[i][0],pts[i][1]+3):c.lineTo(pts[i][0],pts[i][1]+3); c.stroke();
  }
}

let ac = null, soundOn = false;

/* Custom sounds: chosen on this device, kept in this browser only (IndexedDB). Slots: powerup (every sale), goal (weekly target hit) */
const SLOTS={ powerup:{lbl:"sndFileLbl",input:"sndFile",empty:"Load sound",raw:null,name:"",buf:null},
              goal:{lbl:"goalFileLbl",input:"goalFile",empty:"Load goal sound",raw:null,name:"",buf:null},
              fight:{lbl:"fightFileLbl",input:"fightFile",empty:"Load fight sound",raw:null,name:"",buf:null} };
let customSrc=null, customGain=null;
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("h22-power-board",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("sound"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function saveSound(key,name,buf){ try{ const db=await idb(); db.transaction("sound","readwrite").objectStore("sound").put({name,buf},key); }catch(e){} }
async function loadSavedSounds(){ try{ const db=await idb(); Object.keys(SLOTS).forEach(key=>{ const r=db.transaction("sound").objectStore("sound").get(key);
  r.onsuccess=()=>{ if(r.result){ SLOTS[key].raw=r.result.buf; SLOTS[key].name=r.result.name; showSoundName(key); ensureCustomDecoded(); } }; }); }catch(e){} }
function showSoundName(key){ const sl=SLOTS[key], el=$(sl.lbl); el.textContent = sl.name ? ({goal:"Goal: ",fight:"Fight: "}[key]||"Sound: ")+sl.name.replace(/\.[^.]+$/,"") : sl.empty; el.title=sl.name||""; }
async function ensureCustomDecoded(){
  if(!ac) return;
  for(const key in SLOTS){ const sl=SLOTS[key]; if(sl.raw && !sl.buf){ try{ sl.buf=await ac.decodeAudioData(sl.raw.slice(0)); }catch(e){ sl.buf=null; } } }
}
Object.keys(SLOTS).forEach(key=>{ $(SLOTS[key].input).onchange = async e => {
  const f=e.target.files&&e.target.files[0]; if(!f) return; const sl=SLOTS[key];
  try{ sl.raw=await f.arrayBuffer(); sl.name=f.name; sl.buf=null; showSoundName(key); saveSound(key,f.name,sl.raw); ensureCustomDecoded(); }catch(err){}
  e.target.value="";
}; });
function playCustom(level,key="powerup"){
  const sl=SLOTS[key]; if(!soundOn||!ac||!sl.buf) return false;
  stopCustom(0);
  customSrc=ac.createBufferSource(); customGain=ac.createGain();
  customSrc.buffer=sl.buf; customGain.gain.value=key==="powerup"?0.55+level*0.15:0.9;

function stopCustom(fadeMs){
  if(!customSrc||!ac) return; const src=customSrc, g=customGain; customSrc=null;
  try{ const t0=ac.currentTime; g.gain.setValueAtTime(g.gain.value,t0); g.gain.linearRampToValueAtTime(0.0001,t0+fadeMs/1000); src.stop(t0+fadeMs/1000+0.05); }catch(e){}
}

function sfxCharge(ms, level){

  o2.frequency.setValueAtTime(55.5,t0); o2.frequency.exponentialRampToValueAtTime(111+level*90,t0+d);
  f.type="lowpass"; f.frequency.setValueAtTime(300,t0); f.frequency.exponentialRampToValueAtTime(2400+level*800,t0+d);

  o.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination);

function sfxBlast(level){
  if(!soundOn||!ac) return;
  const t0=ac.currentTime, len=1.6, buf=ac.createBuffer(1, ac.sampleRate*len, ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
  const src=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  src.buffer=buf; f.type="lowpass"; f.frequency.value=900+level*700; g.gain.value=0.35+level*0.08;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t0);
  const o=ac.createOscillator(), og=ac.createGain(); o.type="sine";
  o.frequency.setValueAtTime(90,t0); o.frequency.exponentialRampToValueAtTime(35,t0+0.8);
  og.gain.setValueAtTime(0.5,t0); og.gain.exponentialRampToValueAtTime(0.0001,t0+0.9);
  o.connect(og); og.connect(ac.destination); o.start(t0); o.stop(t0+1);
}

/* Spiky anime aura: flat cel layers that flicker on a step timer */
function drawAura(c,cx,cy,w,h,color,power,t){
  const r=rng(Math.floor(t/(reduced?400:75))*7+3);
  [[1,hexA(color,.5)],[0.76,hexA(lighten(color,0.45),.6)],[0.48,"rgba(255,255,255,.6)"]].forEach(([k,fill],li)=>{
    const p=new Path2D(), n=22;
    for(let i=0;i<=n*2;i++){
      const a=Math.PI/2+(i/(n*2))*Math.PI*2, sa=Math.sin(a), tip=i%2===1;
      const rx=w*k, ry=h*k; let x=cx+Math.cos(a)*rx, y=cy+Math.sin(a)*ry*(sa<0?1:0.3);
      if(tip && sa<0.35){ const len=(0.12+r()*0.4)*h*k*Math.max(0.25,-sa+0.35); x+=Math.cos(a)*len*0.25; y-=len; }
      else if(!tip){ x-=Math.cos(a)*rx*0.07; y+=sa<0?ry*0.05:0; }
      i?p.lineTo(x,y):p.moveTo(x,y);
    }
    p.closePath(); c.fillStyle=fill; c.fill(p);
    if(li===0){ c.lineWidth=3; c.strokeStyle=hexA("#ffffff",0.25+0.5*power); c.stroke(p); }
  });
}

/* Meditation aura: soft breathing glow, slow rounded flame, ripples and drifting light motes */
function drawCalmAura(c,cx,cy,groundY,t){
  const breath=0.5+0.5*Math.sin(t/1700);
  c.save();
  const g=c.createRadialGradient(cx,cy,10,cx,cy,150+breath*14);
  g.addColorStop(0,"rgba(190,240,255,0.55)"); g.addColorStop(0.45,"rgba(150,210,255,0.22)"); g.addColorStop(1,"rgba(170,150,255,0)");
  c.fillStyle=g; c.beginPath(); c.ellipse(cx,cy,160+breath*14,175+breath*14,0,0,Math.PI*2); c.fill();
  [[1,"rgba(160,225,255,0.20)","rgba(220,248,255,0.55)"],[0.72,"rgba(200,190,255,0.20)",null],[0.45,"rgba(255,255,255,0.22)",null]].forEach(([k,fill,line],li)=>{
    const p=new Path2D(), n=64, w=(78+breath*6)*k, h=(118+breath*8)*k;
    for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2, sa=Math.sin(a);
      const wob=1+0.06*Math.sin(a*3+t/1300+li)+0.04*Math.sin(a*5-t/1900);
      const up=sa<0?1+0.25*Math.pow(-sa,4):0.35;
      const x=cx+Math.cos(a)*w*wob, y=cy+sa*h*wob*up;
      i?p.lineTo(x,y):p.moveTo(x,y); }
    p.closePath(); c.fillStyle=fill; c.fill(p);
    if(line){ c.strokeStyle=line; c.lineWidth=2; c.stroke(p); }
  });
  for(let i=0;i<3;i++){ const ph=((t/3200)+i/3)%1;
    c.strokeStyle=`rgba(200,240,255,${0.45*(1-ph)})`; c.lineWidth=2.5; c.beginPath(); c.ellipse(cx,groundY+62,40+ph*140,6+ph*16,0,0,Math.PI*2); c.stroke(); }
  for(let i=0;i<14;i++){ const ph=((t/6000)+i*0.071)%1, x=cx+Math.sin(i*2.3+t/2200)*(30+i*5), y=groundY+50-ph*230;
    c.fillStyle=`rgba(230,250,255,${0.8*Math.sin(ph*Math.PI)})`; c.beginPath(); c.arc(x,y,1.6+(i%3),0,Math.PI*2); c.fill(); }
  c.restore();
}

let lastCrew=-1e9, actIdx=0, actStart=null;
function crewLoop(ts){
  requestAnimationFrame(crewLoop);
  if(!$("stage").hidden || ts-lastCrew<33) return; lastCrew=ts;
  if(actStart===null) actStart=ts;
  let act=ACTS[actIdx], t=ts-actStart;
  if(t>act.dur){ actIdx=(actIdx+1)%ACTS.length; actStart=ts; act=ACTS[actIdx]; t=0; }
  const c=cctx; c.clearRect(0,0,SW,SH);
  const p=act.pose(reduced?Math.min(t,700):t);
  const fade=act.fly?1:Math.max(0,Math.min(1,t/600,(act.dur-t)/600));
  const s=Math.min(SH*0.3/300, SW*0.19/200);
  let px=SW*0.79, py=SH*0.9, face=-1, sc=s;
  let rs=null; if(act.run && !reduced){ rs=runState(t); px=rs.x*SW; }
  if(act.fly){ px=lerp(-0.2*SW,1.2*SW,t/act.dur); py=SH*0.19+Math.sin(t/500)*8; face=1; sc=s*0.8; }
  c.save(); c.globalAlpha=fade;
  if(!act.fly){ c.fillStyle="rgba(0,0,0,.35)"; c.beginPath(); c.ellipse(px,py+2,105*s,9*s,0,0,Math.PI*2); c.fill(); }
  c.translate(px,py); c.scale(face*sc,sc);
  if(p.speed){ c.strokeStyle="rgba(255,255,255,.7)"; c.lineWidth=2.5; c.beginPath();
    for(let i=0;i<9;i++){ const yy=-24+i*6, off=(t/3+i*47)%140; c.moveTo(-150-off,yy); c.lineTo(-150-off-60-(i%3)*30,yy); } c.stroke();
    c.save(); c.globalAlpha*=0.5; drawAura(c,-20,6,150,40,IDLE_ACCENT,0.4,ts); c.restore(); }
  if(p.aura) drawCalmAura(c,0,p.y-60,p.y,t);
  if(p.runlines){ c.strokeStyle="rgba(255,255,255,.55)"; c.lineWidth=2.5; c.beginPath();
    for(let i=0;i<7;i++){ const yy=-150+i*20, off=(t/2.5+i*53)%120; c.moveTo(-70-off,yy); c.lineTo(-70-off-40-(i%3)*25,yy); } c.stroke(); }
  const out=drawBody(c,p,IDLE_ACCENT,t);
  c.restore();
  if(rs && rs.moving){
    const dust=lighten(sky().pal.near,0.35);
    for(let i=0;i<6;i++){ const age=((t/110)+i)%6/6;
      c.fillStyle=hexA(dust,0.4*(1-age)); c.beginPath(); c.arc(px+(25+age*110)*s, py-4*s-age*16*s, (5+age*16)*s, 0, Math.PI*2); c.fill(); }
  }
  if(p.zzz && !reduced){
    const hx=px+face*sc*out.head[0], hy=py+sc*out.head[1];
    c.save(); c.textAlign="center"; c.lineJoin="round";
    for(let i=0;i<3;i++){ const ph=((t/1000+i*0.7)%2.1)/2.1, fs=(12+i*5)*sc*1.8;
      c.globalAlpha=fade*Math.min(1,(1-ph)*1.5); c.font=`${fs}px 'Bangers', 'Russo One', Impact, sans-serif`;
      const x=hx+(24+ph*40)*sc*face, y=hy-(40+ph*80)*sc;
      c.lineWidth=fs*0.2; c.strokeStyle=INK; c.strokeText("Z",x,y); c.fillStyle="#ffffff"; c.fillText("Z",x,y); }
    c.restore();
  }
}

/* 90s anime power-up backdrop: saturated colour field with hard alternating light rays */
function energyBackdrop(c,W,H,x,y,col,a,t){
  c.save(); c.globalAlpha=a;
  const R=Math.hypot(W,H), g=c.createRadialGradient(x,y,0,x,y,R*0.7);
  g.addColorStop(0,"#ffffff"); g.addColorStop(0.12,lighten(col,0.6)); g.addColorStop(0.45,col); g.addColorStop(1,darken(col,0.55));
  c.fillStyle=g; c.fillRect(-20,-20,W+40,H+40);
  const n=28, rot=reduced?0:t/2600; c.fillStyle=hexA(lighten(col,0.7),0.35);
  for(let i=0;i<n;i+=2){ const a1=rot+i/n*Math.PI*2, a2=rot+(i+1)/n*Math.PI*2; c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a1)*R,y+Math.sin(a1)*R); c.lineTo(x+Math.cos(a2)*R,y+Math.sin(a2)*R); c.closePath(); c.fill(); }
  c.restore();
}

/* ===== Celebration ===== */
const cv = $("fx"), ctx = cv.getContext("2d");
let W=0,H=0;
function size(){ const d=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", ()=>{ size(); sizeSky(); sizeCrew(); lastIdle=-1e9; });

const queue = []; let playing = false;
function celebrate(sale){
  queue.push(sale);
  const after=weekTotal(sales), before=after-(new Date(sale.soldAt)>=weekStartDate()?sale.contractValue:0);
  if(before<CONFIG.weeklyTarget && after>=CONFIG.weeklyTarget && (sale.example || !goalShown())){ if(!sale.example) markGoalShown(); queue.push({goal:true,total:after}); }
  const mAfter=monthTotal(sales), mBefore=mAfter-(melMonth(sale.soldAt)===melMonth(new Date())?sale.contractValue:0);
  for(let n=Math.floor(mBefore/CONFIG.bossEvery)+1; n<=Math.floor(mAfter/CONFIG.bossEvery); n++){
    if(sale.example || !bossShown(n)){ if(!sale.example) markBossShown(n); queue.push({fight:true,milestone:n*CONFIG.bossEvery,total:mAfter,n}); } }
  if(!playing) next();
}
function next(){
  const sale = queue.shift(); if(!sale){ playing=false; return; }
  playing = true; (sale.fight?runFight(sale):run(sale)).then(()=>{ renderBoard(); setTimeout(next, 400); });
}

function run(sale){
  return new Promise(resolve=>{
    const isGoal=!!sale.goal;
    const tier = isGoal ? GOAL_TIER : tierFor(sale.contractValue), lvl = isGoal ? 3 : CONFIG.tiers.indexOf(tier), C = tier.color;
    const shownValue = isGoal ? sale.total : sale.contractValue;
    const stage=$("stage"), hud=$("hud");
    stage.hidden=false; size();
    stage.style.setProperty("--c",C); hud.style.setProperty("--c",C);
    hud.classList.remove("revealed");
    $("hudTop").innerHTML = isGoal ? `<small>Weekly power level</small>OVER 9000` : `<small>Power level</small>${tier.name.toUpperCase()}`;
    $("hudTop").style.opacity = 0;
    $("hudVal").textContent = "$0";
    $("hudWho").textContent = isGoal ? `IT'S OVER $9,000!` : `Welcome ${sale.firstName}!`;
    $("hudMeta").textContent = isGoal ? `Weekly goal smashed · ${money(CONFIG.weeklyTarget)} contract value target` : `${sale.product} · sold by ${sale.soldBy}`;
    const intro=$("intro"); intro.textContent = isGoal ? "WEEKLY GOAL" : "NEW MEMBER"; intro.classList.remove("go"); void intro.offsetWidth; intro.classList.add("go");

    const st=sky();
    const INTRO=isGoal?1200:900, CHARGE=tier.charge, BURST=500, HOLD=isGoal?8000:6500, FADE=700;
    const tCharge=INTRO, tBurst=INTRO+CHARGE, tHold=tBurst+BURST, tEnd=tHold+HOLD+FADE;
    const sc=Math.min(H*0.5/340, W*0.4/200), cx=W/2, base=H*0.66, horizon=base-60*sc;
    const rr=rng(Date.now()%100000);
    const rocks=Array.from({length:tier.rocks},()=>{ const sz=(5+rr()*14)*sc/2.2; return {
      x:cx+(rr()<.5?-1:1)*(90*sc+rr()*W*0.32), y0:base+rr()*(H-base)*0.4, rise:(40+rr()*170)*sc/2.2, sz, rot:rr()*6, vr:(rr()-.5)*0.03, ph:rr()*6,
      pts:Array.from({length:6},(_,k)=>[Math.cos(k/6*Math.PI*2)*sz*(0.7+rr()*0.5),Math.sin(k/6*Math.PI*2)*sz*(0.6+rr()*0.5)]), vx:0, vy:0, x:0, y:0 }; });
    const parts=[];
    let start=null, chargedSfx=false, blasted=false, last=0;
    const custom=playCustom(lvl, isGoal?"goal":"powerup");

    function frame(ts){
      if(start===null) start=ts;
      const t=ts-start, dt=Math.min(50,ts-(last||ts)); last=ts;
      const cp=Math.min(1,Math.max(0,(t-tCharge)/CHARGE)), ease=cp*cp*(3-2*cp), post=t>tBurst, power=post?1:ease;

      if(t>=tCharge && !chargedSfx){ chargedSfx=true; if(!custom) sfxCharge(CHARGE,lvl); $("hudTop").style.opacity=1; }
      if(t>=tBurst && !blasted){ blasted=true; if(!custom) sfxBlast(lvl); hud.classList.add("revealed");
        rocks.forEach(r=>{ const a=Math.atan2(r.y-(base-150*sc),r.x-cx); r.vx=Math.cos(a)*(0.6+lvl*0.25); r.vy=Math.sin(a)*(0.6+lvl*0.25)-0.25; }); }
      $("hudVal").textContent = money(post ? shownValue : shownValue*ease);

      ctx.save();
      const shakeAmt = reduced?0 : tier.shake*(post ? Math.max(0,1-(t-tBurst)/900)*2 : ease);
      ctx.translate((Math.random()-.5)*shakeAmt,(Math.random()-.5)*shakeAmt);
      drawScene(ctx,W,H,ts,horizon,st);
      // sky darkens as power builds, then the classic full-colour energy backdrop takes over
      ctx.fillStyle=`rgba(6,4,14,${0.12+power*0.32})`; ctx.fillRect(-20,-20,W+40,H+40);
      if(power>0.35) energyBackdrop(ctx,W,H,cx,base-165*sc,C,Math.min(0.92,(power-0.35)*1.6),ts);
      const tint=ctx.createRadialGradient(cx,base-165*sc,10,cx,base-165*sc,Math.max(W,H)*0.6);
      tint.addColorStop(0,hexA(C,0.12+power*0.3)); tint.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=tint; ctx.fillRect(0,0,W,H);
      // manga focus lines
      if(power>0.45 && !reduced){ ctx.save(); ctx.translate(cx,base-165*sc); ctx.strokeStyle=hexA("#ffffff",(power-.45)*0.5);
        const Rm=Math.max(W,H); for(let i=0;i<50+lvl*25;i++){ const a=Math.random()*Math.PI*2, r1=(150+Math.random()*120)*sc, w=1+Math.random()*3;
          ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1); ctx.lineTo(Math.cos(a)*Rm,Math.sin(a)*Rm); ctx.stroke(); } ctx.restore(); }
      // ground cracks
      if(lvl>=2 && power>0.55){ ctx.strokeStyle=hexA(lighten(C,0.4),power); ctx.lineWidth=3;
        for(let k=0;k<4+lvl*2;k++){ const dir=k%2?1:-1; let px=cx+dir*30*sc, py=base+3; ctx.beginPath(); ctx.moveTo(px,py);
          for(let j=0;j<5;j++){ px+=dir*(18+((k*37+j*13)%34))*sc*0.5; py+=(((k+j)%3)-0.6)*5+3; ctx.lineTo(px,py);} ctx.stroke(); } }
      // levitation: rises with the charge, then hovers with a gentle bob
      const lift=power*(26+lvl*9)*sc + (reduced?0:Math.sin(ts/380)*4*sc*power);
      const fy=base-lift;
      ctx.fillStyle=`rgba(0,0,0,${0.45-power*0.2})`; ctx.beginPath(); ctx.ellipse(cx,base+2,(105-power*25)*sc,(9-power*3)*sc,0,0,Math.PI*2); ctx.fill();
      // floating rocks
      rocks.forEach((r,i)=>{
        if(!post){ r.x=r.x||r.x; r.y=r.y0-ease*r.rise*(0.75+0.25*Math.sin(ts/500+r.ph)); r.cx=r.x; }
        else { r.x+=r.vx*dt; r.y+=r.vy*dt; }
        r.rot+=r.vr*(post?3:1);
        ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.rot);
        const p=poly(r.pts); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke(p); ctx.fillStyle=darken(st.pal.far,0.35); ctx.fill(p);
        ctx.save(); ctx.clip(p); ctx.translate(-r.sz*0.25,-r.sz*0.25); ctx.fillStyle=lighten(st.pal.far,0.1); ctx.fill(p); ctx.restore();
        ctx.restore();
      });
      // aura
      const aw=(78+power*(36+lvl*16))*sc, ah=(150+power*(85+lvl*36))*sc;
      drawAura(ctx,cx,fy-162*sc,aw,ah,C,power,ts);
      // rising ki particles
      const want=Math.floor(tier.particles*(reduced?0.3:1)*Math.max(power,post?0.6:0));
      while(parts.length<want) parts.push({x:cx+(Math.random()-.5)*aw*2, y:base-Math.random()*20, v:1+Math.random()*3+lvl, len:6+Math.random()*16, a:1});
      ctx.lineCap="round";
      for(const p of parts){ p.y-=p.v*(1+power); p.a-=0.01;
        if(p.a<=0||p.y<0){ p.x=cx+(Math.random()-.5)*aw*2; p.y=base-Math.random()*20; p.a=1; }
        ctx.strokeStyle=hexA(lighten(C,0.5),p.a); ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y+p.len); ctx.stroke(); }
      // lightning sparks
      if(tier.bolts && power>0.5 && Math.random()<0.55){

      } else {

        if(t>=15800&&t<16800){ energyBackdrop(ctx,W,H,W*0.58,H*0.55,RED,0.85,ts); }
        if(t>=20000&&t<20600){ energyBackdrop(ctx,W,H,W*0.3,H*0.5,"#ffd23a",0.8*(1-(t-20000)/600),ts); }

        // speed streaks while flying
        if(t>=6000&&t<10400&&!reduced){ ctx.strokeStyle="rgba(255,255,255,.35)"; for(let i=0;i<26;i++){ const yy=((i*97+t*0.8)%H), xx=((i*211+t*2.4)%(W+400))-200; ctx.lineWidth=1+(i%3); ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx+80+(i%5)*40,yy); ctx.stroke(); } }

        ctx.save(); ctx.translate(W/2,H/2); ctx.scale(cam.z,cam.z); ctx.translate(-cam.x,-cam.y);
        // world ground
        const gg=ctx.createLinearGradient(0,base,0,base+H); gg.addColorStop(0,lighten(st.pal.near,0.1)); gg.addColorStop(1,darken(st.pal.near,0.5));
        ctx.fillStyle=gg; ctx.fillRect(-W*2,base,W*5,H*3);
        ctx.strokeStyle=darken(st.pal.near,0.6); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-W*2,base); ctx.lineTo(W*3,base); ctx.stroke();
        const crater=(x,w)=>{ ctx.fillStyle=darken(st.pal.near,0.55); ctx.beginPath(); ctx.ellipse(x,base+6*sc,w,w*0.16,0,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle=lighten(st.pal.near,0.25); ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(x,base+4*sc,w*1.05,w*0.18,0,Math.PI*1.05,Math.PI*1.95); ctx.stroke(); };
        if(t>=1800) crater(W*.75,110*sc); if(t>=10300) crater(W*.52,150*sc); if(t>=21500) crater(W*.75,190*sc);
        // shadows (shrink with altitude)
        const shadow=(x,alt,w)=>{ const k=Math.max(0.2,1-alt/600); ctx.fillStyle=`rgba(0,0,0,${0.4*k})`; ctx.beginPath(); ctx.ellipse(x,base+2,w*k,9*sc*k,0,0,Math.PI*2); ctx.fill(); };

        // auras
        if(t>=14000&&t<24100){ const k=Math.min(1,(t-14000)/1500)*(surge?1.5:1); ctx.save(); ctx.globalAlpha=0.85; drawAura(ctx,hx,hy-150*sc,(70+40*k)*sc,(130+80*k)*sc,surge?"#7fdcff":BLUE,Math.min(1,k),ts); ctx.restore(); }

          else { const r=d.r*0.5; ctx.fillStyle=hexA(darken(st.pal.near,0.25),d.life); ctx.strokeStyle=hexA(INK,d.life*0.8); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(d.x,d.y-r); ctx.lineTo(d.x+r,d.y+r*0.6); ctx.lineTo(d.x-r*0.8,d.y+r*0.7); ctx.closePath(); ctx.fill(); ctx.stroke(); } } }
        // speech bubbles
        if(t>=2100&&t<3100) bubble(ctx,vx-70*vs,vy-340*vs,"Your progress stops here.",vx-20*vs,vy-280*vs,Math.min(1,(t-2100)/150));
        if(t>=3200&&t<4200) bubble(ctx,hx+70*sc,hy-330*sc,"Not in my room.",hx+20*sc,hy-270*sc,Math.min(1,(t-3200)/150));
        if(t>=20500&&t<21400) bubble(ctx,vx-40*vs,vy-360*vs,"IMPOSSIBLE!",vx-10*vs,vy-290*vs,1);
        ctx.restore();
        // twinkle (screen space)
        if(t>=22600&&t<23600){ const k=(t-22600)/1000; impactStar(ctx,W*0.88,H*0.16,(1-Math.abs(k*2-1))*30+2,"#ffffff"); }
        // radial focus lines during the charge
        if(t>=14000&&t<17500&&!reduced){ ctx.save(); ctx.translate(W/2,H/2); ctx.strokeStyle="rgba(255,255,255,.22)"; for(let i=0;i<50;i++){ const an=Math.random()*Math.PI*2, r1=Math.min(W,H)*0.32; ctx.lineWidth=1+Math.random()*3; ctx.beginPath(); ctx.moveTo(Math.cos(an)*r1,Math.sin(an)*r1); ctx.lineTo(Math.cos(an)*W,Math.sin(an)*W); ctx.stroke(); } ctx.restore(); }
      }
      ctx.restore();

      // ===== screen-space finish =====
      IMPACTS.forEach(at=>{ if(t>=at&&t<at+110){ ctx.save(); ctx.globalCompositeOperation="difference"; ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); ctx.restore(); } });
      if(t>=21500&&t<22200){ ctx.fillStyle=`rgba(255,255,255,${Math.max(0,1-(t-21500)/700)})`; ctx.fillRect(0,0,W,H); }
      if(t>=20000&&t<20150){ ctx.fillStyle="rgba(200,240,255,.7)"; ctx.fillRect(0,0,W,H); }

      if(t>=24700){ $("hudTop").style.opacity=1; hud.classList.add("revealed"); $("hudVal").textContent=money(item.total*ss(Math.min(1,(t-24700)/1400))); }

    }

  });

/* ===== Live feed (used once hosted where it can reach the sale feed) ===== */
let firstLoad=true;
async function poll(){
  if(!CONFIG.feedUrl) return;
  try{
    const r = await fetch(CONFIG.feedUrl, {cache:"no-store"}); if(!r.ok) return;
    const data = await r.json(), list = data.sales||[];
    if(firstLoad){ // quiet first load: show the week's existing sales without replaying a celebration for each
      firstLoad=false; sales=list.slice(); seen.clear(); list.forEach(s=>seen.add(s.id)); renderBoard(); return; }
    const fresh = list.filter(s=>!seen.has(s.id));
    const ids=new Set(list.map(s=>s.id)); sales=sales.filter(s=>ids.has(s.id)); // drop anything removed on the server (e.g. cleared tests)
    list.forEach(s=>{ if(!sales.some(x=>x.id===s.id)) sales.push(s); });
    fresh.forEach(s=>seen.add(s.id));
    fresh.sort((a,b)=>new Date(a.soldAt)-new Date(b.soldAt)).forEach(celebrate);
    if(!fresh.length) renderBoard();
  }catch(e){}
}
setInterval(poll, CONFIG.pollMs); poll();

wake(); document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) wake(); });

/* aged paper + screentone overlay, drawn once per screen size */
function buildPaper(){
  // 90s cel-film finish: warm burnt edges and a few dust specks (multiply, so the centre stays full colour)
  const cv=$("vPaper"), d=Math.min(1.5,devicePixelRatio||1), w=innerWidth, h=innerHeight; cv.width=w*d; cv.height=h*d;
  const c=cv.getContext("2d"); c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,w,h);
  c.fillStyle="#fffaf0"; c.fillRect(0,0,w,h);
  const e=c.createRadialGradient(w/2,h/2,Math.min(w,h)*0.45,w/2,h/2,Math.hypot(w,h)*0.62);
  e.addColorStop(0,"rgba(255,250,240,0)"); e.addColorStop(1,"rgba(120,70,40,.55)"); c.fillStyle=e; c.fillRect(0,0,w,h);
  const r=rng(2026); for(let i=0;i<180;i++){ c.fillStyle=`rgba(60,40,30,${0.1+r()*0.2})`; c.beginPath(); c.arc(r()*w,r()*h,0.6+r()*1.4,0,Math.PI*2); c.fill(); }
}
addEventListener("resize", buildPaper); buildPaper();

</script>
